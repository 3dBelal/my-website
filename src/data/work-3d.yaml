# 3D work, shown on /3d. See HOW-TO-UPDATE.md.
#
# Each project is one card. "alsoIn" lists extra tabs it appears under.
# The first file in "media" is the card cover;
# clicking the card opens all of its files in the viewer.
# File paths are relative to src/media/ (images) or public/media/ (videos).
# No client or brand names in titles or captions.

categories:
  - id: product
    label: Professional Work
  - id: characters
    label: Characters
  - id: art
    label: Art
  - id: motion
    label: Motion

