# Short "about" text on the home page (one entry per paragraph)
about:
  - >-
    I'm a mechanical engineer (B.Sc., Abdullah Gül University, 2026) and a 3D
    artist who has worked in Blender since 2017. I design parts, print them,
    and visualize them.
  - >-
    I did two internships at Teknopark startups in Kayseri and delivered real
    hardware at both: housings for wearable medical devices, and printed
    enclosure parts that shipped inside a lithium-ion forklift battery. I'm now
    studying for an M.Sc. in Electrical and Electronics Engineering in İstanbul.

