  - id: masswell
    title: Printed enclosures for a forklift battery
    org: Masswell Advanced Energy Systems
    place: Erciyes Teknopark, Kayseri
    period: Aug – Sep 2025
    role: Mechanical Design Intern
    summary: >-
      Five 3D-printed enclosure parts for a lithium-ion forklift battery,
      shipped inside a battery delivered to a client.
    cover: engineering/masswell/masswell-08-bms-closed-installed.jpg
    tools: [SolidWorks, FDM 3D printing, PLA, Heat-set inserts]
    problem: >-
      A lithium-ion forklift battery needed five enclosure parts: a BMS
      housing, a fire safety holder, a power supply container, a resistor case
      and a screen mount.
    did:
      - Built all models in SolidWorks from physical measurements.
      - Printed them in-house in PLA and re-tuned tolerances when parts failed.
      - When the mounting columns fractured, applied FDM anisotropy principles — reoriented the print axis and added fillets at the stress concentration points — fixing the failure without adding material.
    result: All five components shipped inside a battery delivered to a client.
    sections:
      - heading: Failure and fix
        text: >-
          The first mounting columns snapped at the base. FDM parts are weakest
          between layers, so the fix was geometry and print orientation, not
          more material.
        media:
          - file: engineering/masswell/masswell-01-column-broken-v1.jpg
            caption: "v1: column broken at the base."
          - file: engineering/masswell/masswell-02-column-no-fillet-v1.jpg
            caption: "v1: no fillet where the column meets the base."
