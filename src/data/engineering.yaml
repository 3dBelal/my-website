    org: MTM Biotechnology
    place: Erciyes Teknopark, Kayseri
    period: Jun – Aug 2025
    role: Mechanical Design Intern — sole mechanical designer
    summary: >-
      Housings for three wearable medical devices: an EEG headband, an EMG
      muscle sensor and a smart earbud.
    cover: engineering/mtm/mtm-05-headband-final-render.jpg
    tools: [SolidWorks, Blender, Photorealistic rendering, Design for 3D printing]
    problem: >-
      Three wearable devices needed housings at the same time, and I was the
      only mechanical designer. One project arrived as a verbal description,
      with no sketches or CAD reference.
    did:
      - Produced the 3D models and the internal component layout for each device.
      - Iterated the enclosure geometry to keep the sensors in contact with the skin while keeping the parts compact and 3D-print-ready.
      - Coordinated dimensions with the electronics engineer on each device.
      - Made photorealistic renders so the team could review and decide before printing.
    result: >-
      Complete models, layouts and renders for all three devices, delivered
      for stakeholder review.
