studies:
  - id: robot
    title: Self-balancing two-wheel robot
    org: Independent project
    place: Abdullah Gül University
    period: 2024 – 2025
    role: Solo build — chassis, electronics, firmware
    summary: >-
      A two-wheel robot that balances itself with only an IMU. I designed and
      printed the chassis, wired it by hand and wrote all the firmware.
    cover: engineering/robot/push.mp4
    tools: [Blender, FDM 3D printing, Arduino C, Cascaded PID, MPU6050, Bluetooth]
    problem: >-
      Build a two-wheel robot that stays upright on its own and drives forward
      and back, with no wheel encoders and no optical sensors — only an
      MPU6050 IMU.
    did:
      - Designed the chassis in Blender, 3D printed it, wired the electronics by hand, and wrote the full firmware in Arduino C.
      - Implemented a cascaded PID controller — an inner tilt-angle loop for balance and an outer velocity-feedback loop for controlled forward and backward movement.
      - Estimated tilt with a complementary filter on the MPU6050 readings.
      - Fixed I2C bus corruption from motor EMI with isolated power domains, twisted-pair wiring and a firmware bus-reset timeout.
      - Made all PID parameters tunable live over Bluetooth, without reflashing, and logged telemetry to a live dashboard.
    result: >-
      Stable balance within ±0.5° of the setpoint, using only the IMU and a
      complementary filter.
    sections:
      - heading: The robot
        media:
          - file: engineering/robot/push.mp4
            caption: Holding balance while being pushed by hand.
          - file: engineering/robot/walk.mp4
            caption: Driving forward under the outer velocity loop.
          - file: engineering/robot/showreel.mp4
            caption: Project overview.
      - heading: Chassis
        text: Modelled in Blender and 3D printed.
        media:
          - file: engineering/robot/turntable.mp4
            caption: Chassis model.
          - file: engineering/robot/robot-desk.jpg
            caption: On the bench, connected for tuning.
      - heading: Telemetry
        text: >-
          Tilt angle, PID terms and motor output are streamed from the robot
          and plotted live while tuning.
        media:
          - file: engineering/robot/dash.mp4
            caption: Live dashboard next to the real robot.
          - file: engineering/robot/full-telemetry-report.jpg
            caption: "Full run: IMU angle vs target, PID components and motor command."
          - file: engineering/robot/70sec-telemetry-report.jpg
            caption: 70-second window of the same signals.
          - file: engineering/robot/20sec-telemetry-report.jpg
            caption: 20-second window.

  - id: mtm
